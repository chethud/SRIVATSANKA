# Backup-first deploy to EC2 on every push to main.
# Never deletes live kannans.db, .env, or uploads.
name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  REMOTE_ROOT: /home/ubuntu/srivatsanka
  BACKUP_ROOT: /home/ubuntu/srivatsanka-backups

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Package frontend and backend
        run: |
          tar -cf website-dist-deploy.tar -C website/dist .
          tar --format=ustar --exclude='__pycache__' --exclude='*.pyc' -cf backend-deploy.tar -C whatsapp/app .

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Backup live files on EC2
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
          set -e
          STAMP=\$(date +%Y%m%d_%H%M%S)
          DEST="${BACKUP_ROOT}/\$STAMP"
          mkdir -p "\$DEST/whatsapp" "\$DEST/website"
          cp -a "${REMOTE_ROOT}/whatsapp/kannans.db" "\$DEST/whatsapp/" 2>/dev/null || true
          cp -a "${REMOTE_ROOT}/whatsapp/.env" "\$DEST/whatsapp/" 2>/dev/null || true
          if [ -d "${REMOTE_ROOT}/whatsapp/uploads" ]; then cp -a "${REMOTE_ROOT}/whatsapp/uploads" "\$DEST/whatsapp/uploads"; fi
          if [ -d "${REMOTE_ROOT}/website/dist" ]; then cp -a "${REMOTE_ROOT}/website/dist" "\$DEST/website/dist"; fi
          cp -a "${REMOTE_ROOT}/website/.env.production" "\$DEST/website/" 2>/dev/null || true
          echo "BACKUP_OK \$DEST"
          EOF

      - name: Upload artifacts to EC2
        run: |
          scp website-dist-deploy.tar backend-deploy.tar "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Overlay code and restart backend
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
          set -e
          chmod -R u+w "${REMOTE_ROOT}/website/dist" 2>/dev/null || true
          rm -rf "${REMOTE_ROOT}/website/dist/"*
          mkdir -p "${REMOTE_ROOT}/website/dist"
          tar -xf /tmp/website-dist-deploy.tar -C "${REMOTE_ROOT}/website/dist"
          rm -f /tmp/website-dist-deploy.tar

          OVERLAY=/tmp/backend-overlay-\$\$
          mkdir -p "\$OVERLAY"
          umask 022
          tar --no-same-permissions -xf /tmp/backend-deploy.tar -C "\$OVERLAY"
          chmod -R u+w "\$OVERLAY" "${REMOTE_ROOT}/whatsapp/app" 2>/dev/null || true
          cp -rf "\$OVERLAY"/. "${REMOTE_ROOT}/whatsapp/app/"
          rm -rf "\$OVERLAY"
          rm -f /tmp/backend-deploy.tar

          if [ -f "${REMOTE_ROOT}/whatsapp/.env" ]; then
            if grep -q '^ENVIRONMENT=' "${REMOTE_ROOT}/whatsapp/.env"; then
              sed -i 's/^ENVIRONMENT=.*/ENVIRONMENT=production/' "${REMOTE_ROOT}/whatsapp/.env"
            else
              echo 'ENVIRONMENT=production' >> "${REMOTE_ROOT}/whatsapp/.env"
            fi
          fi

          sudo systemctl restart kannans-backend
          sleep 3
          sudo systemctl is-active kannans-backend
          curl -sf --max-time 15 http://127.0.0.1:8000/api/health
          echo
          test -f "${REMOTE_ROOT}/whatsapp/kannans.db" && echo DB_STILL_THERE
          test -d "${REMOTE_ROOT}/whatsapp/uploads" && echo UPLOADS_STILL_THERE || echo UPLOADS_DIR_OPTIONAL
          EOF

      - name: Public health check
        run: |
          sleep 2
          curl -sf --max-time 20 "http://${EC2_HOST}/api/health"
          echo
